name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[llm,dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  plugin:
    name: Plugin manifests and version consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the version matches everywhere it is declared
        run: python scripts/check_versions.py

      - name: Check the server is declared in .mcp.json, not inline
        run: python scripts/check_plugin_layout.py

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace manifest
        run: claude plugin validate ./

      - name: Validate the plugin manifest
        run: claude plugin validate ./plugins/tigergraph --strict
