name: Publish conda package

"on":
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # Requires an 'anaconda-publish' environment configured under repo
    # Settings → Environments with required reviewers and the
    # ANACONDA_API_TOKEN secret.
    environment:
      name: anaconda-publish
      url: https://anaconda.org/tigergraph/tigergraph-mcp

    steps:
      - name: Checkout source at tag
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Validate tag is strict semver
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a strict v<major>.<minor>.<patch> tag."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f  # v5.1.1
        with:
          python-version: '3.11'

      - name: Verify pyproject.toml version matches tag
        run: |
          PROJ_VER=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          TAG_VER="${{ steps.tag.outputs.version }}"
          if [[ "$PROJ_VER" != "$TAG_VER" ]]; then
            echo "::error::pyproject.toml version ($PROJ_VER) does not match tag version ($TAG_VER)."
            exit 1
          fi

      # Build conda from the sdist published on PyPI, so both channels ship
      # the same artifact. PyPI is uploaded by hand, so wait for the version
      # to appear rather than racing the upload or its propagation.
      - name: Point recipe at the PyPI sdist
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, sys, time, urllib.error, urllib.request

          version = os.environ["VERSION"]
          api = f"https://pypi.org/pypi/tigergraph-mcp/{version}/json"
          deadline = time.time() + 30 * 60
          while True:
              try:
                  with urllib.request.urlopen(api, timeout=30) as r:
                      files = json.load(r)["urls"]
                  sdist = next((f for f in files if f["packagetype"] == "sdist"), None)
                  if sdist:
                      break
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              if time.time() > deadline:
                  print(f"::error::tigergraph-mcp {version} sdist is not on PyPI. "
                        "Upload it with ./build.sh --upload, then re-run this workflow.")
                  sys.exit(1)
              print(f"tigergraph-mcp {version} sdist not on PyPI yet; retrying in 60s")
              time.sleep(60)

          print(f"Using {sdist['url']}")
          p = pathlib.Path("tigergraph-mcp-recipe/recipe/meta.yaml")
          t = p.read_text()
          m = re.search(r'^\{% set version = "(.*)" %\}', t, flags=re.M)
          if not m or m.group(1) != version:
              print(f"::error::meta.yaml version ({m and m.group(1)}) does not match tag version ({version}).")
              sys.exit(1)
          t, n = re.subn(
              r'^source:\n(?:  .*\n)+',
              f"source:\n  url: {sdist['url']}\n  sha256: {sdist['digests']['sha256']}\n",
              t, count=1, flags=re.M,
          )
          if n != 1:
              print("::error::No source block found in meta.yaml")
              sys.exit(1)
          p.write_text(t)
          print(re.search(r'^source:\n(?:  .*\n)+', t, flags=re.M).group(0))
          PY

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@a4260408e20b96e80095f42ff7f1a15b27dd94ca  # v3.0.4
        with:
          auto-update-conda: false
          python-version: '3.11'
          channels: tigergraph,conda-forge
          channel-priority: strict

      - name: Install conda-build
        shell: bash -el {0}
        run: conda install -y -n base conda-build

      - name: Build conda package
        shell: bash -el {0}
        run: |
          conda build -c tigergraph -c conda-forge tigergraph-mcp-recipe/recipe --output-folder conda-out --no-anaconda-upload

      - name: Upload to anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [[ -z "$ANACONDA_API_TOKEN" ]]; then
            echo "::error::ANACONDA_API_TOKEN is not set."
            exit 1
          fi
          # anaconda-client via pip; conda-installed binary doesn't reliably reach PATH here.
          pip install --quiet anaconda-client
          PKG=$(ls conda-out/noarch/tigergraph-mcp-*.conda 2>/dev/null | head -1)
          [[ -n "$PKG" ]] || { echo "::error::No conda package found"; exit 1; }
          # Token flows via env var; --token rejects JWTs at argparse.
          anaconda upload --user tigergraph --label main "$PKG"
